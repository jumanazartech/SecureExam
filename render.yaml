# Render Blueprint: one web service (API + built client). The database is hosted on Neon (DATABASE_URL).
# Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: secure-exam-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgres://...neon.tech/neondb?sslmode=require)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
