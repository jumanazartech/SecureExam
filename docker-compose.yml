services:
  db:
    image: postgres:15-alpine
    container_name: exam-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: examdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  server:
    build: ./server
    container_name: exam-server
    depends_on:
      - db
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: examdb
      DB_PORT: 5432
      JWT_SECRET: securesecret
      ADMIN_PIN: 12345
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    command: sh -c "sleep 5 && npm start"

  client:
    build: ./client
    container_name: exam-client
    ports:
      - "3000:5173" # Vite default port map
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://host.docker.internal:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
